name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: ESLint
            command: npm run lint
          - name: TypeScript
            command: npm run typecheck
          - name: Tests
            command: npm run test
          - name: Expo dependency compatibility
            command: npm run expo:check
          - name: Expo Doctor
            command: npm run expo:doctor
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use project npm version
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

  edge-function:
    name: Edge Function type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check anchor function
        run: deno check --config supabase/functions/deno.json supabase/functions/anchor-impact-credential/index.ts

      - name: Test Stellar submission handling
        run: deno test --config supabase/functions/deno.json supabase/functions/anchor-impact-credential/stellar-status.test.ts

  stellar:
    name: Soroban contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32v1-none

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: stellar

      - name: Test contract
        run: cargo test --locked -p community-impact-tests
        working-directory: stellar

      - name: Lint contract
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
        working-directory: stellar

      - name: Install Stellar CLI
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/stellar/stellar-cli/releases/download/v28.0.0/stellar-cli-28.0.0-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/stellar-cli.tar.gz"
          tar -xzf "$RUNNER_TEMP/stellar-cli.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build reproducible WASM
        run: stellar contract build
        working-directory: stellar

      - name: Record WASM hash
        run: sha256sum target/wasm32v1-none/release/community_impact.wasm
        working-directory: stellar
