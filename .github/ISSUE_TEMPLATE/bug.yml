name: Reportar un error
description: Documenta un fallo reproducible de la aplicación.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Explica qué ocurrió y cuál era el comportamiento esperado.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abre...
        2. Pulsa...
        3. Observa...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Plataforma
      options:
        - Android
        - iOS
        - Web
        - Varias plataformas
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit
      placeholder: v1.0.0 o SHA del commit
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia y contexto
      description: Logs, capturas, dispositivo y cualquier dato que ayude a diagnosticarlo. No incluyas secretos ni datos personales.
